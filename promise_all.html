    <script>
         function getStudentData() {
            return new Promise(function (resolve) {    
              resolve("Student Data Found Successfully:");   
            });
        }

        function getCourseData() {
            return new Promise(function (resolve) {    
              resolve("Course Data Found Successfully:");   
            });
        }

        function getAttendenceData() {
            return new Promise(function (resolve) {    
              resolve("Attendence Data Found Successfully:");   
            });
        }
         Promise.all([getStudentData,getCourseData,getAttendenceData])
            .then(result => {
                document.write(`<h3 style='color:green'> All Data is Ready </h3>`);
                result.forEach(item => document.write(item + "<br>"));
            })
            .catch(err => {
                document.write(`<h3 style='color:red'> One or more Promise Failled! </h3>`);
            })
    </script>
