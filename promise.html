    <!-- Promise Means: eg. I am doing some work now. I will give result later . If the word done successfully then i will give you result otherwise i will give error -->

    <!--
   Technical Use:
   -calling an API
   -fetching data from serverr
   -reading file
   -database operation 
   -waiting for timer 

   Total Three states of Promise 
   1.Pending:Initial State, before promise succeeds or fails.
   2.Fulfilled: The operation completed.
   3.Reject : The Operation Failled.
   -->

    <!--
   Syntax:
     let promise=new Promise(function(resolve,reject){
     });
   -->
    <script>
        //Example 1
        let promise = new Promise(function (resolve, reject) {
            let success = true;

            if (success) {
                resolve("Operation Success");
            }
            else {
                reject("Operation Failled!");
            }
        });
    </script>
    <script>
        function login(username, password) {
            return new Promise(function (resolve, reject) {
                if (username === "admin" && password === "1234") {
                    resolve("Login Successfully:");
                }
                else {
                    reject("Invalid Username or Password");
                }
            });
        }

        login("admin", "1234")
            .then(function (result) {
                console.log(result);
            })
             .catch (function(error) {
            console.log(error);
            })

    </script>

    <script>
        let promise3=new Promise((resolve,reject) => {
            console.log("Fetching data.....");

            setTimeout(() => {
                let dataAvailable=false;
                if(dataAvailable){
                    resolve("Data Received from Server... Successfully:");
                }else{
                    reject("Server Error: Something went wrong!");
                }
            },5000);
        });

        promise3
                .then(result => console.log(result))
                .catch(err => console.log(err))
                .finally(() => console.log("Request Process Complete..."))

    </script>
