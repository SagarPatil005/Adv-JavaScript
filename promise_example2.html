<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
  
</head>
<body>
    <script>
        // student data promise 

        function getStudentData(){
          return   new Promise((resolve,reject) => {
            setTimeout(() =>{
                resolve("Student Data Received:");
            },2000);
          });
        }

        function getCourseData(){
          return   new Promise((resolve,reject) => {
            setTimeout(() =>{
                resolve("Course Data Received:");
            },2000);
          });
        }

        function getAttendanceData(){
          return   new Promise((resolve,reject) => {
            setTimeout(() =>{
                resolve("Attendance Data Received:");
            },2000);
          });
        }

        Promise.all([getStudentData(),getCourseData(),getAttendanceData()])
            .then((result) => {
                console.log("All Data Received Successfully:");
                console.log(result);
            })
            .catch((error) => {
                console.log("Something went wrong...");
                console.log(error);
            })
    </script>
</body>
</html>
