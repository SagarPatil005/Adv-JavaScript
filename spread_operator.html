<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Spread Operator</title>
   
</head>
<body>
    <script>
        var arr1=[100,200,300];
        console.log(arr1);
        console.log(...arr1);
        console.log([...arr1]);
    </script>
    <script>
        var arr2=[10,20,30];
        var arr3=[40,50,60,70];
        // var arr4=arr2.concat(arr3);
       // var arr4=[...arr2,...arr3];
       // var arr4=[5,...arr2,...arr3,80];
       arr2.push(35);
       var arr4=[5,...arr2,...arr3,80];

        document.write(arr4);
    </script>
    <script>
        var obj1={
            name:"Raj",
            education:"MA",
        }

         var obj2={
            age:23,
            phone:123576543,
        }

        var obj3={...obj1,...obj2}
        console.log(obj3);
        //document.write(obj3);
        document.write(JSON.stringify(obj3));
        document.write(`<pre> ${JSON.stringify(obj3,null,4)} </pre>`);
      // JSON.stringify(value,replacer,space)

       document.write(`<pre> ${JSON.stringify(obj3,["name","age"],4)} </pre>`);

    </script>
    <script>
        function sumRest(name,...args){  // rest op used in declaring 
            document.write(`Hello ${name} :`);
            let sum=0;
            for(let i in args){
                sum+=args[i];
            }
            document.write(sum + "<br>");
        }
        var arr=[10,20,30,40,50];
        sumRest("Umesh",...arr);

        // the spread operator its allow us to expand or unpack the elements of an arr or properties of object into indivisual value
    </script>
</html>
