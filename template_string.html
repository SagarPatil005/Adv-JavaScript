<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    
</head>

<body>
    <script>

        var name = "sagar";
        var address = "pune";
        var phone = "09876543";

        document.write("My Name is " + name + " , I am from  " + address + ", Contact me on  " + phone + "<br>");

        // Template String/literal 

        // ${name}  - variable/string  interpolation
        //I am from ${address} - template literal interpolation

        document.write(`My Name is ${name} , I am from ${address} , Contact me on ${phone}.`);

        // Template String/literal are string written using  (` `) that allow us  to easily insert variables or expression using ${} 

    </script>

    <script>

        var fname = "sagar";
        var lname = "patil";

        function fullName(fname, lname) {
            return `${fname}  ${lname}`;
        }

        let flname = `Hello ${fullName(fname, lname)}`;
        document.write("<br><br>");
        document.write(fullName(fname, lname));
        document.write("<br>");
        document.write(flname);
        
        console.log(fullName(fname,lname));
        console.log(flname);



    </script>
</body>

</html>
